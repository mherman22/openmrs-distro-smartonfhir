# Everything this distribution adds to the reference application, and nothing else.
#
# The rest of this repository is openmrs-distro-referenceapplication at 3.7.1, unchanged, so that what
# is demonstrated is the reference application with SMART on FHIR added rather than a bespoke stack
# that resembles it. Adding an overlay is the idiom the reference application itself uses.
#
#   cp .env.example .env     # set SMART_LAUNCH_SECRET
#   docker compose -f docker-compose.yml -f docker-compose.smart.yml up -d
#
# Compose merges docker-compose.override.yml automatically, and that file adds `build:` to every
# service, so name the two files explicitly unless you mean to rebuild the images.

name: smartonfhir

services:
  backend:
    # The reference application image plus one seeded runtime property; see backend/Dockerfile.
    build:
      context: ./backend
      args:
        TAG: ${TAG:-qa}
    environment:
      # Which authorization server to trust, and for which FHIR server. The image turns OMRS_EXTRA_<NAME>
      # into a runtime property, lowercased, with '_' becoming '.' -- so these arrive as smart.issuer,
      # smart.audience and so on.
      OMRS_EXTRA_SMART_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/openmrs
      OMRS_EXTRA_SMART_AUDIENCE: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      # Keys are fetched container-to-container; apps are told the browser-reachable address instead.
      OMRS_EXTRA_SMART_JWKS_URI: http://keycloak:8080/realms/openmrs/protocol/openid-connect/certs
      OMRS_EXTRA_SMART_ADVERTISED_JWKS_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/openmrs/protocol/openid-connect/certs
      # The same secret the realm is imported with: both ends of the launch handshake sign with it.
      OMRS_EXTRA_SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
    volumes:
      # Which apps may be launched. Read-only: what a deployment permits is not something a running
      # system should be able to rewrite.
      - ./config/smart-apps.json:/openmrs/data/config/smart-apps.json:ro
      # Built from ../openmrs-module-smartonfhir with `mvn clean install`.
      - ${SMARTONFHIR_OMOD:-../openmrs-module-smartonfhir/omod/target/smartonfhir-2.0.0-SNAPSHOT.omod}:/openmrs/distribution/openmrs_modules/smartonfhir.omod:ro

  frontend:
    environment:
      # Where this distribution places SMART extensions: the frontend module declares what it offers,
      # the distribution decides where it appears.
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
    volumes:
      # The published image bakes in its own copy, so editing the file in this repository changes
      # nothing until it is mounted over that copy.
      - ./frontend/config-core_demo.json:/usr/share/nginx/html/config-core_demo.json:ro

  keycloak:
    # Keycloak plus the federation provider's JDBC driver; see keycloak/Dockerfile.
    build:
      context: ./keycloak
      args:
        KEYCLOAK_TAG: ${KEYCLOAK_TAG:-26.7.1}
    restart: unless-stopped
    # Pinned deliberately. Every SPI the SMART provider implements is internal to Keycloak -- the
    # server logs KC-SERVICES0047 for each -- so a minor upgrade can break it with no deprecation
    # cycle.
    command: [ start-dev, --import-realm ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Keycloak substitutes ${NAME} in an imported realm from its own environment, so the realm is
      # committed as a template and needs no rendering step.
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL:-http://localhost/openmrs}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      SMART_APP_BASE_URL: ${SMART_APP_BASE_URL:-http://localhost:3000}
      SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
      SSL_REQUIRED: ${SSL_REQUIRED:-none}
      # The user federation provider reads the OpenMRS users table directly.
      OPENMRS_JDBC_URL: jdbc:mysql://db:3306/openmrs
      OPENMRS_DB_USER: ${OMRS_DB_USER:-openmrs}
      OPENMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Built from ../openmrs-contrib-keycloak-smart-auth with `mvn clean install`.
      - ${SMART_AUTH_JAR:-../openmrs-contrib-keycloak-smart-auth/keycloak-smart-auth/target/keycloak-smart-auth-1.0.0-SNAPSHOT.jar}:/opt/keycloak/providers/openmrs-smart-auth.jar:ro
      # Optional: lets clinicians sign in with the OpenMRS password they already have. Without it,
      # Keycloak users are created and kept in step by hand.
      - ${USERSTORE_JAR:-../openmrs-contrib-keycloak-auth/openmrs-keycloak-userstore/target/openmrs-keycloak-userstore-1.0.0-SNAPSHOT.jar}:/opt/keycloak/providers/openmrs-userstore.jar:ro
      - ./realm:/opt/keycloak/data/import:ro
      # Keycloak state is deliberately not persisted: the realm is declarative and re-imported on every
      # start, so a persisted database would only let a container drift from the committed realm.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # start-dev serves the management endpoints on 9000.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
