# Everything this distribution adds to the reference application, and nothing else.
#
# The rest of this repository is openmrs-distro-referenceapplication at 3.7.1, unchanged,
# so that what we demonstrate is the reference application with SMART on FHIR added rather
# than a bespoke stack that happens to resemble it. Adding an overlay is the same idiom the
# reference application itself uses for local builds in docker-compose.override.yml.
#
# Compose merges override.yml automatically, and that file adds `build:` to every service.
# We do not want to rebuild the images to run a launch, so up.sh names its files explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.smart.yml up -d
#
# To build the frontend or backend from source, add -f docker-compose.override.yml back.

# The reference application's compose does not name its project, so it would default to
# this directory and a rename would orphan the database volume. Named here, in the overlay,
# because the identity belongs to this distribution rather than to the base.
name: smartonfhir-dev

services:
  frontend:
    environment:
      # A list, comma separated. The first is the demo configuration baked into the
      # published image; the second is ours. This is where the distribution places SMART
      # extensions -- the frontend module declares what it offers, the distribution decides
      # where it appears.
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json,/openmrs/spa/config-smartonfhir.json
    volumes:
      - ./frontend/config-smartonfhir.json:/usr/share/nginx/html/config-smartonfhir.json:ro

  backend:
    volumes:
      # Built by ../openmrs-module-smartonfhir. Mounted into the distribution directory,
      # which the image copies into the runtime module directory on start. distro.properties
      # names the same module for a real distribution build; this is the fast path for
      # working on it.
      - ${SMARTONFHIR_OMOD:-./target/modules/smartonfhir.omod}:/openmrs/distribution/openmrs_modules/smartonfhir.omod:ro
      # Generated by up.sh: which authorization server to trust, and the shared launch
      # secret. Both agree with the rendered realm by construction.
      - ./target/openmrs-config/smart-oauth2.json:/openmrs/data/config/smart-oauth2.json:ro
      - ./target/openmrs-config/smart-secret-key.json:/openmrs/data/config/smart-secret-key.json:ro
      # The app registry. Read-only like the rest: which apps may be launched is a
      # deployment decision, not something a running system should be able to rewrite.
      - ./target/openmrs-config/smart-apps.json:/openmrs/data/config/smart-apps.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.7.1}
    restart: unless-stopped
    # Pinned deliberately. Every SPI this provider implements is internal to Keycloak --
    # the server logs KC-SERVICES0047 for each one -- so a minor upgrade can break it with
    # no deprecation cycle. Move the pin only with realm/verify-realm-import.sh green
    # against the new version.
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Built by up.sh from the sibling openmrs-contrib-keycloak-smart-auth checkout.
      - ${SMART_AUTH_JAR:-../openmrs-contrib-keycloak-smart-auth/openmrs-keycloak-smart-auth/target/openmrs-keycloak-smart-auth-1.0.0-SNAPSHOT.jar}:/opt/keycloak/providers/openmrs-smart-auth.jar:ro
      # Lets Keycloak authenticate against the OpenMRS users table, so clinicians use the
      # credentials they already have. Optional: without it, Keycloak users must be created
      # and kept in step by hand.
      - ${USERSTORE_JAR:-../openmrs-contrib-keycloak-auth/openmrs-keycloak-userstore/target/openmrs-keycloak-userstore-1.0.0-SNAPSHOT.jar}:/opt/keycloak/providers/openmrs-userstore.jar:ro
      # The federation provider's own JDBC driver. Keycloak ships a MySQL driver for its own
      # datasource, but Quarkus does not expose it to provider classloaders -- and with an
      # embedded database it is not on the provider classpath at all. Keycloak's answer is
      # that a provider's dependencies belong in providers/ beside it.
      - ${MYSQL_CONNECTOR_JAR:-./target/providers/mysql-connector-j.jar}:/opt/keycloak/providers/mysql-connector-j.jar:ro
      # Rendered by up.sh from realm/: holds a generated secret and this environment's
      # URLs, so it is never committed.
      - ./target/import:/opt/keycloak/data/import:ro
      # Keycloak state is deliberately not persisted. The realm is declarative and
      # re-imported on every start, so a persisted H2 database would only let a container
      # drift from the committed realm -- and a named volume here mounts as root while
      # Keycloak runs as uid 1000, so it could not write to it anyway.
    healthcheck:
      # start-dev serves the management endpoints on 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
