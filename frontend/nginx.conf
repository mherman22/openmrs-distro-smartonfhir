worker_processes  1;
user              nobody;

events {
  worker_connections  1024;
  multi_accept        off;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  tcp_nopush    on;
  tcp_nodelay   on;
  sendfile      on;

  keepalive_timeout  65;

  map $http_user_agent $loggable {
    default 1;
    "~Blackbox-Exporter" 0;
  }

  access_log /var/log/nginx/access.log combined if=$loggable;

  server {
    listen  80;
    root    /usr/share/nginx/html;
    index   index.html;

    # never cache the service-worker
    location ~* service-worker\.js$ {
      expires -1d;
      try_files $uri =404;
    }

    # The frontend module packed from this repository keeps the same version in its path -- 1.0.0 --
    # across every rebuild, because it is not published and nothing bumps it. `expires 1y` below is
    # correct only for assets whose URL changes when their content does, and this one's does not: a
    # browser that has visited before serves a year-old chunk alongside a freshly revalidated entry
    # file, the module ids disagree, and the application dies in LOADING_SOURCE_CODE with
    # `__webpack_modules__[e] is undefined`. Revalidate it instead. This block must stay above the
    # general .js rule -- nginx takes the first matching regex location.
    location ~* ^/uwdigi-esm-smart-app-launch-app-[^/]+/ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location ~* (\.js|openmrs\.(\w*\.)?css)$ {
      expires 1y;
      try_files $uri =404;
    }

    # handle anything with a "." that's not an HTML file
    # assume it's a static file
    location ~* \.(?!html?)[^.]+$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # any other URL should serve the single page
    location / {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files /index.html =404;
    }
  }
 }
