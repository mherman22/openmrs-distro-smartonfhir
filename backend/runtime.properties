# Read by the authentication module, which reads runtime properties and nothing else.
#
# These are here rather than in the compose environment because the image lowercases every
# OMRS_EXTRA_<NAME> it turns into a property, and `authentication.whiteList` has a capital L. Everything
# else this distribution configures arrives as OMRS_EXTRA_* in docker-compose.smart.yml.

# Register the module's bearer scheme, so Context.authenticate can route a SMART access token to it.
authentication.scheme=smartbearer
authentication.scheme.smartbearer.type=org.openmrs.module.smartonfhir.web.smart.SmartBearerTokenAuthenticationScheme

# Everything is whitelisted, deliberately. Registering a scheme is what makes the authentication
# module's filter the gatekeeper for the whole webapp, and for a non-whitelisted request from an
# unauthenticated caller it calls handleAuthenticationFailure even when the scheme offers no challenge
# URL -- on the OpenMRS root that is a redirect loop. Reading the bearer header is the module's own
# filter's job, scoped to FHIR paths. Whether to enforce authentication centrally is an implementer's
# decision, and not this distribution's to make.
authentication.whiteList=/*
