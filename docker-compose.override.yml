# Seeds the demonstration app.
#
# Compose loads this file automatically alongside docker-compose.yml, so `docker compose up -d` still
# leaves a stack you can launch from. Launchable apps live in the database and are managed over REST,
# so there is nothing to declare as an environment variable in the main file.
#
# Delete this file for a distribution that starts with nothing registered. If you need a local override
# of your own, add it here rather than in a second override file: Compose reads only one.
services:
  register-app:
    image: curlimages/curl:8.11.1
    depends_on:
      - backend
    restart: "no"
    environment:
      OMRS_ADMIN_USER: ${OMRS_ADMIN_USER:-admin}
      OMRS_ADMIN_PASSWORD: ${OMRS_ADMIN_PASSWORD:-Admin123}
      SMART_APP_NAME: ${SMART_APP_NAME:-Vitals Review}
      SMART_APP_LAUNCH_URL: ${SMART_APP_LAUNCH_URL:-http://localhost:3000/launch.html}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        api="http://backend:8080/openmrs/ws/rest/v1/smartapp"
        auth="$${OMRS_ADMIN_USER}:$${OMRS_ADMIN_PASSWORD}"

        # A first boot installs the database and then loads demo data, and the REST API answers before
        # either has finished. Registering during that window is lost: the row is written and the
        # install then discards it, so the service exits happy and the registry is empty. So this waits
        # for the install to settle, registers, and then confirms the row survived -- retrying the whole
        # cycle if it did not.
        registered=""
        n=0
        while [ "$$n" -lt 180 ]; do
          n=$$((n + 1))
          sleep 10

          # 200 and a parseable list, not merely a reachable port.
          curl -sf -u "$$auth" "$$api" -o /tmp/apps.json 2>/dev/null || continue
          grep -q '"results"' /tmp/apps.json || continue

          if grep -q "$${SMART_APP_NAME}" /tmp/apps.json; then
            echo "'$${SMART_APP_NAME}' is registered"
            exit 0
          fi

          # Only register once per pass; the next pass verifies it stuck.
          if [ -z "$$registered" ]; then
            if curl -sf -u "$$auth" -X POST "$$api" -H 'Content-Type: application/json' -d "{
                \"name\": \"$${SMART_APP_NAME}\",
                \"description\": \"Trends, derived BMI, and reference-range flagging for the launched patient\",
                \"launchUrl\": \"$${SMART_APP_LAUNCH_URL}\",
                \"clientId\": \"smartClient\",
                \"launchContext\": \"patient\"
              }" -o /dev/null 2>/dev/null; then
              echo "registered '$${SMART_APP_NAME}'; confirming it survives the install"
              registered="yes"
            fi
          else
            # It was registered and is now absent, so the install discarded it. Try again.
            echo "the registration did not survive; registering again"
            registered=""
          fi
        done

        echo "gave up after 30 minutes; register the app with a POST to $$api" >&2
        exit 1
