# The SMART on FHIR demonstration stack: the O3 reference application, Keycloak 26 as its authorization
# server, and a SMART application launched from a patient chart.
#
#   cp .env.example .env     # set SMART_LAUNCH_SECRET
#   docker compose up -d --build

name: smartonfhir

services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${OPENMRS_PORT:-80}:80"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      OMRS_EXTRA_SMART_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/openmrs
      OMRS_EXTRA_SMART_AUDIENCE: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      OMRS_EXTRA_SMART_JWKS_URI: http://keycloak:8080/realms/openmrs/protocol/openid-connect/certs
      OMRS_EXTRA_SMART_ADVERTISED_JWKS_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/openmrs/protocol/openid-connect/certs
      OMRS_EXTRA_SMART_USERNAME_CLAIM: preferred_username
      OMRS_EXTRA_SMART_ALLOWED_CLOCK_SKEW_SECONDS: 10
      OMRS_EXTRA_SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
      OMRS_EXTRA_AUTHENTICATION_SCHEME: smartbearer
      OMRS_EXTRA_AUTHENTICATION_SCHEME_SMARTBEARER_TYPE: org.openmrs.module.smartonfhir.web.smart.SmartBearerTokenAuthenticationScheme
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      - ${SMARTONFHIR_OMOD:-./backend/modules/smartonfhir.omod}:/openmrs/distribution/openmrs_modules/smartonfhir.omod:ro

  keycloak:
    build:
      context: ./keycloak
      args:
        KEYCLOAK_TAG: ${KEYCLOAK_TAG:-26.7.1}
    restart: unless-stopped
    command: [ start-dev, --import-realm ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL:-http://localhost/openmrs}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      SMART_APP_BASE_URL: ${SMART_APP_BASE_URL:-http://localhost:3000}
      SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
      SSL_REQUIRED: ${SSL_REQUIRED:-none}
      OPENMRS_JDBC_URL: jdbc:mysql://db:3306/openmrs
      OPENMRS_DB_USER: ${OMRS_DB_USER:-openmrs}
      OPENMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ${SMART_AUTH_JAR:-./keycloak/providers/keycloak-smart-auth.jar}:/opt/keycloak/providers/openmrs-smart-auth.jar:ro
      - ${USERSTORE_JAR:-./keycloak/providers/openmrs-keycloak-userstore.jar}:/opt/keycloak/providers/openmrs-userstore.jar:ro
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  smart-app:
    image: ghcr.io/mherman22/openmrs-smart-vitals-reviews-app:${SMART_APP_VERSION:-0.1.4}
    restart: unless-stopped
    ports:
      - "${SMART_APP_PORT:-3000}:8080"
    environment:
      SMART_CLIENT_ID: smartClient
      SMART_ISS: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      SMART_ORGANIZATION: OpenMRS Reference Application
      SMART_FRAME_ANCESTORS: "'self' ${OPENMRS_FRAME_ORIGIN:-http://localhost}"

  db:
    image: mariadb:10.11.7
    restart: unless-stopped
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
