# The SMART on FHIR demonstration stack: OpenMRS Reference Application 3.7.1 with Keycloak 26 as its
# authorization server, and a SMART application launched from a patient chart.
#
#   cp .env.example .env     # set SMART_LAUNCH_SECRET
#   docker compose up -d --build
#
# One file rather than a reference-application base plus an overlay. The overlay was there to keep the
# reference application's own compose untouched, which is worth something in a fork that tracks it and
# nothing in a demonstration people have to be able to read. Everything below is either the reference
# application unchanged or one of the four additions SMART needs: the realm, the two Keycloak providers,
# the module, and the app.

name: smartonfhir

services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${OPENMRS_PORT:-80}:80"

  frontend:
    # Built rather than pulled, because the app shell has to be assembled with the SMART launch frontend
    # module in it. Which modules exist is decided when the shell is built; where they appear is decided
    # by frontend/config-core_demo.json at runtime.
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    # The reference application image plus the runtime properties its environment cannot express; see
    # backend/Dockerfile.
    build:
      context: ./backend
      args:
        TAG: ${TAG:-qa}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      # Which authorization server to trust is stated in backend/smart-oauth2.json, mounted below.
      # Every key there can also be given as a runtime property, which overrides it -- see the README.
      #
      # The launch secret stays here because it is a secret: this repository is public, and a signing
      # key committed to it is a key anyone can sign a launch with. The image turns OMRS_EXTRA_<NAME>
      # into a runtime property, lowercased with '_' becoming '.', so this arrives as
      # smart.launch.secret and overrides any config/smart-secret-key.json.
      OMRS_EXTRA_SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
      # The one app this distribution permits to be launched. An app declared nowhere cannot be
      # launched at all: SmartEhrLaunchServlet is given an id and looks the address up, rather than
      # being told where to send the clinician.
      #
      # These arrive as smart.app.vitalsreview.*, and they take this route rather than being written
      # into backend/runtime.properties because the server owns that file. The image merges every
      # OMRS_EXTRA_* into openmrs-runtime.properties at every start; because this distribution ships
      # that file (see backend/Dockerfile) it takes that path even on an empty volume, and the merged
      # values survive InitializationFilter rewriting the file during the install. Where no such file
      # exists the image instead writes them into openmrs-server.properties as property.<name>, which
      # is what InitializationFilter reads -- so either way these reach the module.
      #
      # The id has no separator because '_' becomes '.' in that mapping and nothing becomes '-'. An id
      # that needs a word break is written '__' here, which arrives as '_'.
      OMRS_EXTRA_SMART_APP_VITALSREVIEW_NAME: Vitals Review
      OMRS_EXTRA_SMART_APP_VITALSREVIEW_DESCRIPTION: Trends, derived BMI, and reference-range flagging for the launched patient
      OMRS_EXTRA_SMART_APP_VITALSREVIEW_CLIENTID: smartClient
      OMRS_EXTRA_SMART_APP_VITALSREVIEW_LAUNCHURL: http://localhost:3000/launch.html
      OMRS_EXTRA_SMART_APP_VITALSREVIEW_LAUNCHCONTEXT: patient
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      # Which authorization server to trust, for which FHIR server, and where its keys are. Read-only:
      # what a deployment trusts is not something a running system should be able to rewrite. Change
      # the addresses here together with the matching values in .env -- Keycloak's realm reads those,
      # and the two have to agree.
      - ./backend/smart-oauth2.json:/openmrs/data/config/smart-oauth2.json:ro
      # Shipped in this repository so a clone starts without building anything first; see ARTIFACTS.md
      # for which commit it was built from and how to replace it. Point SMARTONFHIR_OMOD at your own
      # build to work on the module.
      - ${SMARTONFHIR_OMOD:-./backend/modules/smartonfhir.omod}:/openmrs/distribution/openmrs_modules/smartonfhir.omod:ro

  keycloak:
    # Keycloak plus the federation provider's JDBC driver; see keycloak/Dockerfile.
    build:
      context: ./keycloak
      args:
        KEYCLOAK_TAG: ${KEYCLOAK_TAG:-26.7.1}
    restart: unless-stopped
    # Pinned deliberately. Every SPI the SMART provider implements is internal to Keycloak -- the server
    # logs KC-SERVICES0047 for each -- so a minor upgrade can break it with no deprecation cycle.
    command: [ start-dev, --import-realm ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Keycloak substitutes ${NAME} in an imported realm from its own environment, so the realm is
      # committed as a template and needs no rendering step.
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL:-http://localhost/openmrs}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      SMART_APP_BASE_URL: ${SMART_APP_BASE_URL:-http://localhost:3000}
      SMART_LAUNCH_SECRET: ${SMART_LAUNCH_SECRET:?set SMART_LAUNCH_SECRET in .env}
      SSL_REQUIRED: ${SSL_REQUIRED:-none}
      # The user federation provider reads the OpenMRS users table directly.
      OPENMRS_JDBC_URL: jdbc:mysql://db:3306/openmrs
      OPENMRS_DB_USER: ${OMRS_DB_USER:-openmrs}
      OPENMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Shipped in this repository; see ARTIFACTS.md. Override with SMART_AUTH_JAR to run your own build.
      - ${SMART_AUTH_JAR:-./keycloak/providers/keycloak-smart-auth.jar}:/opt/keycloak/providers/openmrs-smart-auth.jar:ro
      # Optional: lets clinicians sign in with the OpenMRS password they already have. Without it,
      # Keycloak users are created and kept in step by hand.
      - ${USERSTORE_JAR:-./keycloak/providers/openmrs-keycloak-userstore.jar}:/opt/keycloak/providers/openmrs-userstore.jar:ro
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # Keycloak state is deliberately not persisted: the realm is declarative and re-imported on every
      # start, so a persisted database would only let a container drift from the committed realm.
    depends_on:
      # Not just the database: the user federation provider validates its Hibernate mappings against the
      # OpenMRS schema as Keycloak starts, and on a first run that schema does not exist until OpenMRS
      # has installed it. Waiting only for the database gave "Schema validation: missing table [person]".
      backend:
        condition: service_healthy
    healthcheck:
      # start-dev serves the management endpoints on 9000.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  smart-app:
    # The SMART application, which is developed and released on its own:
    # https://github.com/mherman22/openmrs-smart-vitals-reviews-app
    #
    # Only its image appears here, and deliberately. A SMART application is a third-party artefact by
    # nature -- it reads the record over the FHIR API like any other client and knows nothing about this
    # distribution -- so building it from a directory in this repository would misrepresent the very
    # boundary the demonstration exists to show. Everything it needs is an environment variable.
    #
    # It is served on the address the realm permits as a redirect target and the app registry names as a
    # launch URL, so all three agree by construction. The image carries its own healthcheck.
    image: ghcr.io/mherman22/openmrs-smart-vitals-reviews-app:${SMART_APP_VERSION:-0.1.2}
    restart: unless-stopped
    ports:
      - "${SMART_APP_PORT:-3000}:8080"
    environment:
      SMART_CLIENT_ID: smartClient
      # Enables the standalone launch as well as the EHR one: with a FHIR server configured, opening the
      # app directly sends the clinician to sign in and choose a patient rather than refusing.
      SMART_ISS: ${FHIR_BASE_URL:-http://localhost/openmrs/ws/fhir2/R4}
      SMART_ORGANIZATION: OpenMRS Reference Application
      # Lets OpenMRS embed the app in an iframe rather than sending the clinician to another tab. The
      # EHR and the app are different origins even on one host, so the EHR's origin has to be named:
      # 'self' alone means localhost:3000 only, and the chart is served from localhost.
      SMART_FRAME_ANCESTORS: "'self' ${OPENMRS_FRAME_ORIGIN:-http://localhost}"

  db:
    image: mariadb:10.11.7
    restart: unless-stopped
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
